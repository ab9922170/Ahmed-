<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسبة العزومة</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#241c15;--mu:#7a6c5d;--ac:#d9531e;--ok:#2e8b57;--bad:#c0392b;--bd:#eadfd2}
@media (prefers-color-scheme:dark){:root{--bg:#1b1612;--card:#271f19;--tx:#f3ebe2;--mu:#a89886;--bd:#3a2f26}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:14px;max-width:560px;margin-inline:auto}
h1{font-size:22px;margin:4px 0 12px}h1 small{font-size:13px;font-weight:400;color:var(--mu)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.c h2{font-size:15px;margin:0 0 8px;color:var(--mu)}
input,select,button,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;min-width:0}
textarea{width:100%;direction:ltr;margin-bottom:6px}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}
.r{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}.r>input{flex:1}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:4px 10px;margin:0 0 6px 6px}
.chip b{cursor:pointer;color:var(--mu)}
.q{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:5px 11px;font-size:14px;font-weight:400;margin:0 0 6px 6px}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--ok)}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.it:first-of-type{border-top:0}.it small{color:var(--mu);display:block}
details.it{display:block}summary{cursor:pointer}
.x{background:none;color:var(--mu);padding:4px 8px;border:0;font-size:18px}
.cb{display:flex;align-items:center;gap:8px;flex:1}.cb input{width:20px;height:20px;padding:0;min-width:20px}.dn{text-decoration:line-through;color:var(--mu)}
.big{font-size:26px;font-weight:700;color:var(--ac)}
.row{display:flex;justify-content:space-between;padding:4px 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mu{color:var(--mu)}
</style>
</head>
<body>
<h1>🍖 حسبة العزومة <small id="st"></small></h1>
<div id="msg" class="c mu" hidden></div>

<div class="c"><h2>مين معانا؟</h2><div id="people"></div>
  <div class="r"><input id="pn" placeholder="اسم الشخص"><button data-a="addP">إضافة</button></div>
  <div class="r"><label class="mu" style="align-self:center">البادجيت للفرد</label><input id="bud" type="number" inputmode="numeric" style="max-width:110px;flex:0 1 110px"><span class="mu" style="align-self:center">جنيه</span></div>
</div>
<div class="c"><h2>المصروفات</h2><div class="bar"><i id="bf"></i></div><div id="bt" class="mu"></div></div>
<div class="c"><h2>🛒 قايمة المشتريات</h2><div id="td"></div>
  <div class="r"><input id="tn" placeholder="اللي لازم نجيبه"><button data-a="addT">إضافة</button></div></div>
<div class="c"><h2>إضافة حاجة</h2>
  <div class="r"><input id="in" placeholder="الصنف (لحمة، خضار...)"></div>
  <div id="qk"></div><div id="hint" class="mu" style="font-size:13px;margin-bottom:6px"></div>
  <div class="r"><input id="ip" type="number" inputmode="decimal" placeholder="السعر"><input id="iq" type="number" inputmode="decimal" placeholder="الكمية" value="1" style="max-width:80px;flex:0 1 80px"></div>
  <div class="r"><select id="ipay" style="flex:1"></select><button data-a="addI">إضافة</button></div>
</div>
<div class="c"><h2>الأصناف</h2><div id="items"></div></div>
<div class="c"><h2>الحسبة النهائية</h2><div id="res"></div>
  <button data-a="wa" style="width:100%;margin-top:10px">📲 شارك النتيجة</button></div>
<button data-a="save" style="width:100%;margin-bottom:8px">💾 احفظ العزومة في السجل وابدأ جديدة</button>
<button class="g" data-a="reset" style="width:100%">مسح الأصناف بدون حفظ</button>
<div class="c" style="margin-top:12px"><h2>📖 سجل العزومات</h2><div id="hs"></div></div>
<details class="c"><summary>⚙️ المزامنة والمشاركة</summary>
  <p class="mu" style="font-size:14px">البيانات محفوظة على جهازك. للمشاركة مع الشلة: لينك بيانات العزومة (نسخة لحظية)، أو فعّل المزامنة اللحظية بـ Firebase (الخطوات في README).</p>
  <div class="r"><button class="g" data-a="lkD">🔗 لينك بيانات العزومة</button><button class="g" data-a="lkS">🔗 لينك انضمام للمزامنة</button></div>
  <textarea id="cfg" rows="5" placeholder="الصق firebaseConfig هنا"></textarea>
  <div class="r"><input id="room" placeholder="كود الغرفة (10 حروف على الأقل)" style="direction:ltr"><button class="g" data-a="gen">عشوائي</button></div>
  <div class="r"><button data-a="svS">حفظ وتفعيل</button><button class="g" data-a="offS">إيقاف المزامنة</button></div>
</details>

<script type="module">
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(n*100)/100).toLocaleString('ar-EG');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const KEY='lunchsplit.v1',SK='lunchsplit.sync';
const norm=o=>({budget:o.budget===undefined?200:Number(o.budget)||0,people:Array.isArray(o.people)?o.people:[],items:Array.isArray(o.items)?o.items:[],todo:Array.isArray(o.todo)?o.todo:[],history:Array.isArray(o.history)?o.history:[]});
const load=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))};
let S=norm(load(KEY)||{}),remote=null,last={};
let mt;function msg(t){const m=$('#msg');m.textContent=t;m.hidden=false;clearTimeout(mt);mt=setTimeout(()=>m.hidden=true,5000)}

/* كل تعديل بيتطبق محلياً، وبعدين على الغرفة المشتركة (transaction) لو المزامنة شغالة */
async function mutate(fn){
  fn(S);persist();render();
  if(remote){try{await remote.run(fn)}catch(e){$('#st').textContent='🔴 تعذرت المزامنة'}}
}
function twice(el,fn){if(el._a){clearTimeout(el._t);el._a=0;el.textContent=el._o;fn();return}el._o=el.textContent;el._a=1;el.textContent='متأكد؟ دوس تاني';el._t=setTimeout(()=>{el._a=0;el.textContent=el._o},3000)}

function calc(){
  const P=S.people,n=P.length,total=S.items.reduce((a,x)=>a+x.price*x.qty,0),paid={};
  P.forEach(p=>paid[p]=0);let other=0;
  S.items.forEach(x=>{const v=x.price*x.qty;if(x.payer&&paid[x.payer]!==undefined)paid[x.payer]+=v;else other+=v});
  const bal=P.map(p=>({p,v:paid[p]-(total-other)/n}));
  const rec=bal.filter(b=>b.v>.5).map(b=>({...b})),pay=bal.filter(b=>b.v<-.5).map(b=>({p:b.p,v:-b.v})),tr=[];
  let i=0,j=0;
  while(i<pay.length&&j<rec.length){const m=Math.min(pay[i].v,rec[j].v);tr.push(`${pay[i].p} يحوّل لـ ${rec[j].p}: ${fmt(m)} ج`);pay[i].v-=m;rec[j].v-=m;if(pay[i].v<.5)i++;if(rec[j].v<.5)j++}
  return{n,total,share:n?total/n:0,other,tr};
}
function render(){
  const P=S.people,c=calc(),cap=S.budget*c.n;
  $('#people').innerHTML=P.map((p,i)=>`<span class="chip">${esc(p)} <b data-a="rP" data-i="${i}">×</b></span>`).join('')||'<div class="mu" style="margin-bottom:6px">ضيف الأسماء الأول</div>';
  if(document.activeElement!==$('#bud'))$('#bud').value=S.budget;
  const sel=$('#ipay'),cur=sel.value;
  sel.innerHTML='<option value="">دفعها مين؟ (اختياري)</option>'+P.map(p=>`<option>${esc(p)}</option>`).join('');sel.value=cur;
  $('#bf').style.width=(cap>0?Math.min(100,c.total/cap*100):0)+'%';
  $('#bf').style.background=cap>0&&c.total>cap?'var(--bad)':'var(--ok)';
  $('#bt').innerHTML=`المصروف: <b>${fmt(c.total)}</b> من ${fmt(cap)} · `+(cap>0?(c.total>cap?`<span class="bad">زيادة ${fmt(c.total-cap)}</span>`:`<span class="ok">باقي ${fmt(cap-c.total)} (≈ ${fmt((cap-c.total)/c.n)} للفرد)</span>`):'حدد البادجيت والأسماء');
  $('#items').innerHTML=S.items.map(x=>`<div class="it"><div>${esc(x.name)}<small>${fmt(x.price)} × ${fmt(x.qty)}${x.payer?' · دفعها '+esc(x.payer):''}</small></div><div><b>${fmt(x.price*x.qty)}</b><button class="x" data-a="rI" data-id="${x.id}">×</button></div></div>`).join('')||'<div class="mu">لسه مفيش أصناف</div>';
  let h='';
  if(!c.n)h='<div class="mu">ضيف الأسماء عشان تظهر الحسبة</div>';
  else{
    h=`<div class="row"><span>نصيب كل واحد</span><span class="big">${fmt(c.share)} ج</span></div>`;
    if(c.other>0)h+=`<div class="mu" style="font-size:13px">فيه ${fmt(c.other)} ج مفيش حد متسجل دافعها، تجاهلها في التحويلات.</div>`;
    h+=c.tr.length?'<div style="margin-top:8px"><b>التحويلات:</b></div>'+c.tr.map(t=>`<div class="row">${esc(t)}</div>`).join(''):(c.total>0?'<div class="ok" style="margin-top:8px">مفيش تحويلات.</div>':'');
  }
  $('#res').innerHTML=h;
  $('#td').innerHTML=S.todo.map(t=>`<div class="it"><label class="cb${t.done?' dn':''}"><input type="checkbox" data-t="${t.id}"${t.done?' checked':''}> ${esc(t.name)}</label><button class="x" data-a="rT" data-id="${t.id}">×</button></div>`).join('')||'<div class="mu">القايمة فاضية</div>';
  const hs=[...S.history].sort((a,b)=>b.ts-a.ts);last={};
  [...hs].reverse().forEach(e=>e.items.forEach(x=>last[x.name]=Number(x.price)||0));
  const avg=hs.length?hs.reduce((a,e)=>a+e.total,0)/hs.length:0,avgp=hs.length?hs.reduce((a,e)=>a+e.share,0)/hs.length:0;
  $('#hs').innerHTML=(hs.length?`<div class="mu" style="margin-bottom:6px">${hs.length} عزومة · المتوسط ${fmt(avg)} ج (≈ ${fmt(avgp)} للفرد)</div>`:'<div class="mu">لسه مفيش عزومات متسجلة</div>')+
    hs.map(e=>`<details class="it"><summary>${esc(e.date)} · <b>${fmt(e.total)} ج</b> · ${fmt(e.share)} للفرد</summary><div style="padding-top:6px">${e.items.map(x=>`<div class="row"><span>${esc(x.name)}</span><span>${fmt((Number(x.price)||0)*(Number(x.qty)||1))}</span></div>`).join('')}<div class="mu">${e.n} أفراد</div><button class="g" data-a="rH" data-id="${e.id}" style="margin-top:6px">حذف العزومة</button></div></details>`).join('');
}

const Q=['لحمة','فراخ','كفتة','خضار','سلطة','عيش','فحم','مشروبات','حلويات'];
$('#qk').innerHTML=Q.map(q=>`<button class="q" type="button" data-q="${q}">${q}</button>`).join('');
function hint(){const p=last[$('#in').value.trim()];$('#hint').textContent=p!==undefined?'آخر مرة: '+fmt(p)+' ج':'';if(p!==undefined&&$('#ip').value==='')$('#ip').value=p}
$('#in').oninput=hint;
$('#bud').onchange=()=>{const v=Number($('#bud').value)||0;mutate(d=>{d.budget=v})};
$('#td').onchange=e=>{const id=e.target.dataset.t;if(id)mutate(d=>{const t=d.todo.find(x=>x.id===id);if(t)t.done=e.target.checked})};

async function share(url){
  if(navigator.share){try{await navigator.share({url});return}catch(e){}}
  try{await navigator.clipboard.writeText(url);msg('اتنسخ اللينك ✅')}catch(e){prompt('انسخ اللينك:',url)}
}
const base=()=>location.origin+location.pathname;
const A={
  addP(){const v=$('#pn').value.trim();if(!v||S.people.includes(v))return;$('#pn').value='';mutate(d=>{if(!d.people.includes(v))d.people.push(v)})},
  rP(el){const p=S.people[+el.dataset.i];mutate(d=>{d.people=d.people.filter(x=>x!==p)})},
  addT(){const v=$('#tn').value.trim();if(!v)return;const t={id:uid(),name:v,done:false,ts:Date.now()};$('#tn').value='';mutate(d=>{d.todo.push(t)})},
  rT(el){const id=el.dataset.id;mutate(d=>{d.todo=d.todo.filter(x=>x.id!==id)})},
  addI(){
    const name=$('#in').value.trim(),price=Number($('#ip').value),qty=Number($('#iq').value)||1;
    if(!name||$('#ip').value===''||!(price>=0))return;
    const it={id:uid(),name,price,qty,payer:$('#ipay').value,ts:Date.now()};
    $('#in').value='';$('#ip').value='';$('#iq').value='1';$('#hint').textContent='';
    mutate(d=>{d.items.push(it)});
  },
  rI(el){const id=el.dataset.id;mutate(d=>{d.items=d.items.filter(x=>x.id!==id)})},
  reset(el){twice(el,()=>mutate(d=>{d.items=[]}))},
  save(el){
    if(!S.items.length){msg('مفيش أصناف تتسجل.');return}
    const id=uid(),ts=Date.now(),date=new Date().toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'});
    mutate(d=>{if(!d.items.length)return;const t=d.items.reduce((a,x)=>a+x.price*x.qty,0),n=d.people.length;
      d.history.push({id,ts,date,total:t,n,share:n?t/n:t,items:d.items.map(x=>({name:x.name,price:x.price,qty:x.qty,payer:x.payer}))});d.items=[]});
  },
  rH(el){const id=el.dataset.id;twice(el,()=>mutate(d=>{d.history=d.history.filter(x=>x.id!==id)}))},
  wa(){
    const c=calc();if(!c.n)return;
    const t=`🍖 حسبة العزومة\nالمصروف: ${fmt(c.total)} ج\nنصيب كل واحد: ${fmt(c.share)} ج`+(c.tr.length?'\n\nالتحويلات:\n'+c.tr.join('\n'):'');
    if(navigator.share)navigator.share({text:t}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
  },
  lkD(){share(base()+'#d='+enc({budget:S.budget,people:S.people,items:S.items,todo:S.todo}))},
  lkS(){const s=load(SK);if(!s){msg('فعّل المزامنة الأول.');return}share(base()+'#s='+enc(s))},
  gen(){$('#room').value=uid()+uid()},
  svS(){
    const cfg={};($('#cfg').value.match(/(\w+)\s*:\s*["']([^"']+)["']/g)||[]).forEach(m=>{const k=m.match(/(\w+)\s*:\s*["']([^"']+)["']/);cfg[k[1]]=k[2]});
    const room=$('#room').value.trim();
    if(!cfg.apiKey||!cfg.projectId){msg('الصق firebaseConfig كامل (فيه apiKey و projectId).');return}
    if(room.length<10){msg('كود الغرفة لازم 10 حروف على الأقل.');return}
    localStorage.setItem(SK,JSON.stringify({c:cfg,r:room}));location.reload();
  },
  offS(){localStorage.removeItem(SK);location.reload()}
};
document.addEventListener('click',e=>{
  const q=e.target.dataset&&e.target.dataset.q;if(q){$('#in').value=q;hint();$('#ip').focus();return}
  const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el);
});

async function connect(s){
  try{
    const V='10.12.2',[{initializeApp},{getFirestore,doc,onSnapshot,runTransaction}]=await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)]);
    const db=getFirestore(initializeApp(s.c)),ref=doc(db,'rooms',s.r);
    remote={run:fn=>runTransaction(db,async tx=>{const snap=await tx.get(ref),d=norm(snap.exists()?snap.data():S);fn(d);tx.set(ref,d)})};
    $('#st').textContent='🟡 بيتصل...';
    onSnapshot(ref,snap=>{
      if(snap.exists()){S=norm(snap.data());persist();render();$('#st').textContent='🟢 متزامن'}
      else remote.run(()=>{}).catch(()=>{});
    },()=>{$('#st').textContent='🔴 خطأ في المزامنة (راجع القواعد)'});
  }catch(e){$('#st').textContent='🔴 تعذر تحميل Firebase'}
}

/* لينكات المشاركة */
(function(){
  const m=location.hash.slice(1).match(/^([sd])=(.+)$/);
  if(m){
    try{
      const o=dec(m[2]);
      if(m[1]==='s'&&o.c&&o.r)localStorage.setItem(SK,JSON.stringify(o));
      if(m[1]==='d'){const n=norm(o);S.budget=n.budget;S.people=n.people;S.items=n.items;S.todo=n.todo;persist();msg('اتحمّلت بيانات العزومة من اللينك ✅')}
    }catch(e){msg('اللينك مش سليم.')}
    history.replaceState(null,'',location.pathname);
  }
})();
const sync=load(SK);
if(sync){$('#room').value=sync.r;$('#cfg').value=JSON.stringify(sync.c,null,1);connect(sync)}
render();
</script>
</body>
</html>
